name: Build ModChecker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build ModChecker/ModChecker.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ModChecker
          path: ModChecker/bin/Release/net472/ModChecker.dll
